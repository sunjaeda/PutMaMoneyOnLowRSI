name: Refresh data & deploy

# Runs the Python fetcher in GitHub's cloud (no PC needed) and regenerates
# data.js, then:
#   1. commits the fresh data.js back to the repo  -> Vercel auto-redeploys
#   2. publishes index.html + data.js to GitHub Pages
# Use whichever host you like; both stay in sync from the same 11 AM run.
#
# Schedule: once per weekday at 11:00 AM US Eastern, while the S&P market is
# open. GitHub cron is UTC and ignores daylight saving, so we list both
# candidate UTC hours and a gate job runs the deploy only when it's actually
# 11 AM in New York.

on:
  schedule:
    - cron: "0 15 * * 1-5"   # 11:00 ET while daylight saving is on  (Mar–Nov)
    - cron: "0 16 * * 1-5"   # 11:00 ET while standard time is on    (Nov–Mar)
  workflow_dispatch:          # manual "Run workflow" button (always runs)
  push:
    branches: [main]          # redeploy on site changes (always runs)

permissions:
  contents: write   # needed to commit the refreshed data.js back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Decide whether this run should proceed. Manual runs and pushes always do;
  # scheduled runs proceed only at 11 AM New York time (handles DST).
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=America/New_York date +%H)" = "11" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: it is $(TZ=America/New_York date +%H:%M) in New York, not 11 AM."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build-deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch data & compute RSI
        run: python fetch_data.py --keep-all

      - name: Commit refreshed data.js (triggers Vercel redeploy)
        run: |
          if git diff --quiet -- data.js; then
            echo "data.js unchanged — nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.js
            git commit -m "chore: refresh stock data [skip ci]"
            git push
          fi

      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html data.js _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
